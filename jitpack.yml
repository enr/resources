# JitPack build: Java 25 is not a stock JitPack JDK, install it via SDKMAN.
# Each step runs in its own shell (`sdk use` does not persist), so everything happens in one command.
# Maven comes from SDKMAN too: the mvnw wget download fails on JitPack.
install:
  - JAVA_ID=$(sdk list java | grep -o "25\.[0-9.]*-tem" | head -1)
    && sdk install java "$JAVA_ID" && sdk use java "$JAVA_ID"
    && sdk install maven 3.10.0 && sdk use maven 3.10.0
    && java -version && mvn -version
    && mvn --batch-mode --no-transfer-progress install -DskipTests
